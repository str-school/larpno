<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join Room</title>

    <link rel="icon" type="image/x-icon" href="larpno.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top left, #ff3b3b55, transparent 35%),
                radial-gradient(circle at bottom right, #4c6fff55, transparent 35%),
                #101018;

            color: white;
        }

        .container {
            width: 420px;
            padding: 32px 40px;

            background: rgba(25, 25, 35, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(255, 60, 60, 0.08);

            backdrop-filter: blur(15px);
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 18px;
        }

        .logo img {
            width: 130px;
            height: 130px;

            object-fit: contain;

            filter:
                drop-shadow(0 0 10px rgba(255, 64, 64, 0.35)) drop-shadow(0 0 25px rgba(255, 64, 64, 0.15));

            transition: 0.25s ease;
        }

        .logo img:hover {
            transform: scale(1.05);
            filter:
                drop-shadow(0 0 15px rgba(255, 64, 64, 0.5)) drop-shadow(0 0 30px rgba(255, 64, 64, 0.2));
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            font-size: 14px;
            font-weight: bold;
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 15px 16px;

            border: 2px solid #2e2e3d;
            border-radius: 12px;

            background: #181821;
            color: white;

            font-size: 16px;
            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #ff4040;

            box-shadow:
                0 0 0 3px rgba(255, 64, 64, 0.12);
        }

        #roomCode {
            text-transform: uppercase;
            letter-spacing: 5px;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
        }

        button {
            width: 100%;
            padding: 16px;

            margin-top: 10px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(135deg,
                    #ff4040,
                    #ff1744);

            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(255, 64, 64, 0.25);

            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(255, 64, 64, 0.4);
        }

        button:active {
            transform: translateY(1px);
        }

        .create {
            text-align: center;
            margin-top: 25px;

            color: #888;
            font-size: 14px;
        }

        .create a {
            color: #ff5555;
            text-decoration: none;
            font-weight: bold;
        }

        .create a:hover {
            text-decoration: underline;
        }

        .cards {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .card {
            position: absolute;

            width: 90px;
            height: 130px;

            border-radius: 12px;

            opacity: 0.08;
            transform: rotate(20deg);
        }

        .card.red {
            background: #ff3030;
            top: 10%;
            left: 10%;
        }

        .card.blue {
            background: #367cff;
            bottom: 10%;
            left: 15%;
            transform: rotate(-20deg);
        }

        .card.yellow {
            background: #ffd62e;
            top: 15%;
            right: 10%;
            transform: rotate(-15deg);
        }

        .card.green {
            background: #32d45b;
            bottom: 12%;
            right: 12%;
            transform: rotate(25deg);
        }

        @media (max-width: 500px) {
            .container {
                width: calc(100% - 30px);
                padding: 30px 25px;
            }

            .logo {
                font-size: 40px;
            }
        }
    </style>
</head>

<body>

    <div class="cards">
        <div class="card red"></div>
        <div class="card blue"></div>
        <div class="card yellow"></div>
        <div class="card green"></div>
    </div>

    <div class="container">

        <div class="logo">
            <img src="larpno.png" alt="Larpno Logo">
        </div>

        <h1>Join a Room</h1>

        <p class="subtitle">
            Enter the room code to join the game
        </p>

        <div class="input-group">
            <label for="username">USERNAME</label>
            <input type="text" id="username" placeholder="Enter your username" maxlength="16">
        </div>

        <div class="input-group">
            <label for="roomCode">ROOM CODE</label>
            <input type="text" id="roomCode" placeholder="ABC123" maxlength="6">
        </div>

        <button id="joinButton">
            JOIN ROOM
        </button>

        <p class="create">
            Don't have a room?
            <a href="create-room.html">Create one</a>
        </p>

    </div>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();

        document.getElementById("joinButton").addEventListener("click", () => {

            const username =
                document.getElementById("username").value.trim();

            const roomCode =
                document.getElementById("roomCode").value.trim();

            if (!username) {
                alert("Enter a username!");
                return;
            }

            if (!roomCode) {
                alert("Enter a room code!");
                return;
            }

            console.log("Joining room:", roomCode);
            console.log("Username:", username);

            sessionStorage.setItem("username", username);
            sessionStorage.setItem("roomCode", roomCode.toUpperCase());

            window.location.href = "game.html";

        });
    </script>

</body>

</html>
